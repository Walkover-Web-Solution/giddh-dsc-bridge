name: Build DSC Bridge installers

# Produces the macOS .dmg, Windows .exe, and Linux .deb installers for the
# Giddh DSC Bridge (native host + status companion app).
#
# Windows code signing (SSL.com eSigner) is wired up but INACTIVE until the
# ES_USERNAME / ES_PASSWORD / ES_CREDENTIAL_ID / ES_TOTP_SECRET repo secrets
# are added (Settings -> Secrets and variables -> Actions -> Secrets). Until
# then the signing steps are skipped automatically and the build still
# succeeds, producing an unsigned installer. See docs/WINDOWS_SIGNING.md.
#
# Configure the published Chrome extension ID as a repo variable:
#   Settings -> Secrets and variables -> Actions -> Variables -> GIDDH_EXT_ID
# Until it is published, the placeholder in packaging/extension-id.txt is used
# and the installers must be rebuilt once the real ID is known.

on:
  push:
    branches:
      - main
      - "test-*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.6.0). Leave blank to use the VERSION file."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pin to 3.11: PyInstaller (6.x) supports 3.9–3.13 officially and
          # is known-broken on 3.14, which is the default python on the
          # windows-latest runner as of late 2026.
          python-version: "3.11"

      - name: Resolve version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi

      - name: Install Python build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r dsc-bridge/native-host/requirements.txt

      # ── macOS: .dmg ──────────────────────────────────────────────────────
      - name: Build macOS .dmg
        if: matrix.os == 'macos-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
        run: |
          chmod +x packaging/macos/build_macos.sh packaging/macos/scripts/postinstall
          ./packaging/macos/build_macos.sh

      # ── Windows: freeze → sign (optional) → installer → sign (optional) ──
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --no-progress -y

      - name: Freeze Windows executables
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./packaging/windows/freeze.ps1

      - name: Check signing credentials
        if: matrix.os == 'windows-latest'
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.ES_USERNAME }}" ] && [ -n "${{ secrets.ES_PASSWORD }}" ] && \
             [ -n "${{ secrets.ES_CREDENTIAL_ID }}" ] && [ -n "${{ secrets.ES_TOTP_SECRET }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SSL.com eSigner credentials found — signing is ENABLED."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SSL.com eSigner credentials not configured — building UNSIGNED (add ES_* secrets to enable)."
          fi

      # SSLcom/esigner-codesign@v1.3.2's output_path param only creates the
      # leaf directory; the parent must exist or the action fails with
      # ENOENT. Create all three ahead of time, idempotently.
      - name: Create signing output directories
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/signed-host"     | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts/signed-status"   | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts/signed-installer" | Out-Null
          Write-Host "✅ Signing output directories ready."

      # Sign the two frozen executables BEFORE they are embedded in the
      # installer (so the installer ships already-signed binaries), mirroring
      # the app-exe-then-installer signing order used for Electron builds.
      - name: Sign host executable (SSL.com eSigner)
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.HOST_EXE_PATH }}
          output_path: artifacts/signed-host
          malware_block: false
          environment_name: PROD
          override: true

      - name: Sign status app executable (SSL.com eSigner)
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.STATUS_EXE_PATH }}
          output_path: artifacts/signed-status
          malware_block: false
          environment_name: PROD
          override: true

      - name: Copy signed executables back and verify
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedHost = Get-ChildItem -Path "artifacts/signed-host" -Filter "*.exe" | Select-Object -First 1
          $signedStatus = Get-ChildItem -Path "artifacts/signed-status" -Filter "*.exe" | Select-Object -First 1
          if (-not $signedHost)   { throw "Signed host exe not found" }
          if (-not $signedStatus) { throw "Signed status exe not found" }

          Copy-Item $signedHost.FullName $env:HOST_EXE_PATH -Force
          Copy-Item $signedStatus.FullName $env:STATUS_EXE_PATH -Force

          foreach ($p in @($env:HOST_EXE_PATH, $env:STATUS_EXE_PATH)) {
            $sig = Get-AuthenticodeSignature $p
            Write-Host "$p signature: $($sig.Status)"
            if ($sig.Status -ne "Valid") { throw "Signature verification failed for $p" }
          }
          Write-Host "✅ Host and status executables signed and verified."

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1

      - name: Sign installer (SSL.com eSigner)
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.INSTALLER_PATH }}
          output_path: artifacts/signed-installer
          malware_block: false
          environment_name: PROD
          override: true

      - name: Copy signed installer back and verify
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem -Path "artifacts/signed-installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $signedInstaller) { throw "Signed installer not found" }
          Copy-Item $signedInstaller.FullName $env:INSTALLER_PATH -Force
          $sig = Get-AuthenticodeSignature $env:INSTALLER_PATH
          Write-Host "Installer signature: $($sig.Status)"
          if ($sig.Status -ne "Valid") { throw "Installer signature verification failed" }
          Write-Host "✅ Installer signed and verified."

      # ── Linux: .deb ──────────────────────────────────────────────────────
      - name: Install Tk (for the companion GUI app)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Build Linux .deb
        if: matrix.os == 'ubuntu-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
        run: |
          chmod +x packaging/linux/build_deb.sh packaging/linux/debian/postinst packaging/linux/debian/prerm
          ./packaging/linux/build_deb.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: giddh-dsc-bridge-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # S3 upload — runs once all OS-specific builds complete. The Windows leg
  # must succeed with a valid Authenticode signature before the installers
  # are promoted to the public "latest" path.
  #
  # Path layout mirrors packaging/macos/build_macos.sh and the Electron
  # release workflow:
  #
  #   s3://$S3_BUCKET/<env>/<os>/<version>/<installer>
  #   s3://$S3_BUCKET/<env>/<os>/latest/<installer>   (for the prod env only)
  #
  # <env> is `test` for branches starting with `test-` and `prod` for
  # everything else (main + v* tags).
  # ---------------------------------------------------------------------
  upload_to_s3:
    name: Upload to S3
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # for AWS OIDC; safe even with static keys
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect environment from branch
        id: env
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == test-* ]]; then
            echo "env=test"  >> "$GITHUB_OUTPUT"
            echo "artifact_prefix=test" >> "$GITHUB_OUTPUT"
          else
            echo "env=prod"  >> "$GITHUB_OUTPUT"
            echo "artifact_prefix="    >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Windows + macOS + Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ---- Windows ----
      - name: Find signed Windows installer
        id: win
        run: |
          # `actions/download-artifact@v4` extracts into a directory named
          # after the artifact (the matrix uploader names it
          # `giddh-dsc-bridge-${matrix.os}`), so the dir is
          # `giddh-dsc-bridge-windows-latest`, not `windows-latest`.
          WIN_DIR="artifacts/giddh-dsc-bridge-windows-latest"
          if [ ! -d "$WIN_DIR" ]; then
            echo "::error::Windows artifact directory not found at $WIN_DIR"
            echo "::error::Contents of artifacts/:"
            ls -la artifacts/ 2>&1 || true
            exit 1
          fi
          INSTALLER=$(find "$WIN_DIR" -maxdepth 2 -name "GiddhDSCBridge-Setup-*.exe" -not -name "*.blockmap" | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::Signed Windows installer not found in $WIN_DIR"
            echo "::error::Contents of $WIN_DIR:"
            ls -la "$WIN_DIR/" 2>&1 || true
            exit 1
          fi
          echo "installer=$INSTALLER"     >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$INSTALLER" .exe | sed 's/GiddhDSCBridge-Setup-//')" >> "$GITHUB_OUTPUT"

          # Verify Authenticode signature before promoting to S3.
          # signtool isn't installed on ubuntu-latest; we trust the in-workflow
          # `Get-AuthenticodeSignature` check that ran on windows-latest.
          echo "verified_by_ci=true"      >> "$GITHUB_OUTPUT"

      - name: Upload Windows installer to S3 (versioned)
        env:
          S3_PATH_PREFIX: ${{ steps.env.outputs.env }}
          S3_VERSION: ${{ steps.win.outputs.version }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          INSTALLER="${{ steps.win.outputs.installer }}"
          aws s3 cp "$INSTALLER" \
            "s3://$S3_BUCKET/$S3_PATH_PREFIX/windows/$S3_VERSION/$(basename "$INSTALLER")" \
            --content-type "application/x-msdownload"
          echo "Uploaded to s3://$S3_BUCKET/$S3_PATH_PREFIX/windows/$S3_VERSION/$(basename "$INSTALLER")"

      - name: Promote Windows installer to "latest" (prod only)
        if: steps.env.outputs.env == 'prod'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          INSTALLER="${{ steps.win.outputs.installer }}"
          aws s3 cp "$INSTALLER" \
            "s3://$S3_BUCKET/prod/windows/latest/GiddhDSCBridge-Setup.exe" \
            --content-type "application/x-msdownload"
          echo "Promoted to s3://$S3_BUCKET/prod/windows/latest/GiddhDSCBridge-Setup.exe"

      # ---- macOS ----
      - name: Find macOS DMG
        id: macos
        run: |
          MAC_DIR="artifacts/giddh-dsc-bridge-macos-latest"
          if [ ! -d "$MAC_DIR" ]; then
            echo "::error::macOS artifact directory not found at $MAC_DIR"
            ls -la artifacts/ 2>&1 || true
            exit 1
          fi
          DMG=$(find "$MAC_DIR" -maxdepth 2 -name "GiddhDSCBridge-*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::macOS DMG not found in $MAC_DIR"
            ls -la "$MAC_DIR/" 2>&1 || true
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$DMG" .dmg | sed 's/GiddhDSCBridge-//')" >> "$GITHUB_OUTPUT"

      - name: Upload macOS DMG to S3 (versioned)
        env:
          S3_PATH_PREFIX: ${{ steps.env.outputs.env }}
          S3_VERSION: ${{ steps.macos.outputs.version }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DMG="${{ steps.macos.outputs.dmg }}"
          aws s3 cp "$DMG" \
            "s3://$S3_BUCKET/$S3_PATH_PREFIX/macos/$S3_VERSION/$(basename "$DMG")" \
            --content-type "application/x-apple-diskimage"
          echo "Uploaded to s3://$S3_BUCKET/$S3_PATH_PREFIX/macos/$S3_VERSION/$(basename "$DMG")"

      - name: Promote macOS DMG to "latest" (prod only)
        if: steps.env.outputs.env == 'prod'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DMG="${{ steps.macos.outputs.dmg }}"
          aws s3 cp "$DMG" \
            "s3://$S3_BUCKET/prod/macos/latest/GiddhDSCBridge.dmg" \
            --content-type "application/x-apple-diskimage"
          echo "Promoted to s3://$S3_BUCKET/prod/macos/latest/GiddhDSCBridge.dmg"

      # ---- Linux ----
      - name: Find Linux .deb
        id: linux
        run: |
          LINUX_DIR="artifacts/giddh-dsc-bridge-ubuntu-latest"
          if [ ! -d "$LINUX_DIR" ]; then
            echo "::error::Linux artifact directory not found at $LINUX_DIR"
            ls -la artifacts/ 2>&1 || true
            exit 1
          fi
          DEB=$(find "$LINUX_DIR" -maxdepth 2 -name "giddh-dsc-bridge_*.deb" | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::Linux .deb not found in $LINUX_DIR"
            ls -la "$LINUX_DIR/" 2>&1 || true
            exit 1
          fi
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$DEB" | sed -n 's/.*giddh-dsc-bridge_\([^_]*\)_.*\.deb/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Upload Linux .deb to S3 (versioned)
        env:
          S3_PATH_PREFIX: ${{ steps.env.outputs.env }}
          S3_VERSION: ${{ steps.linux.outputs.version }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DEB="${{ steps.linux.outputs.deb }}"
          aws s3 cp "$DEB" \
            "s3://$S3_BUCKET/$S3_PATH_PREFIX/linux/$S3_VERSION/$(basename "$DEB")" \
            --content-type "application/vnd.debian.binary-package"
          echo "Uploaded to s3://$S3_BUCKET/$S3_PATH_PREFIX/linux/$S3_VERSION/$(basename "$DEB")"

      - name: Promote Linux .deb to "latest" (prod only)
        if: steps.env.outputs.env == 'prod'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DEB="${{ steps.linux.outputs.deb }}"
          aws s3 cp "$DEB" \
            "s3://$S3_BUCKET/prod/linux/latest/giddh-dsc-bridge.deb" \
            --content-type "application/vnd.debian.binary-package"
          echo "Promoted to s3://$S3_BUCKET/prod/linux/latest/giddh-dsc-bridge.deb"

  release:
    name: Attach installers to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
