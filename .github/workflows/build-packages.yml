name: Build DSC Bridge installers

# Produces the macOS .dmg, Windows .exe, and Linux .deb installers for the
# Giddh DSC native host. Runs on a version tag (v1.2.0) or manually.
#
# Configure the published Chrome extension ID as a repo variable:
#   Settings -> Secrets and variables -> Actions -> Variables -> GIDDH_EXT_ID
# Until it is published, the placeholder in packaging/extension-id.txt is used
# and the installers must be rebuilt once the real ID is known.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.3.0)"
        required: false
        default: "1.3.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ github.event.inputs.version || '1.3.0' }}" >> "$GITHUB_ENV"
          fi

      - name: Install Python build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r dsc-bridge/native-host/requirements.txt

      # ---- macOS: .dmg -------------------------------------------------------
      - name: Build macOS .dmg
        if: matrix.os == 'macos-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
        run: |
          chmod +x packaging/macos/build_macos.sh packaging/macos/scripts/postinstall
          ./packaging/macos/build_macos.sh

      # ---- Windows: .exe -----------------------------------------------------
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --no-progress -y

      - name: Build Windows .exe
        if: matrix.os == 'windows-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
        shell: pwsh
        run: ./packaging/windows/build_windows.ps1

      # ---- Linux: .deb -------------------------------------------------------
      - name: Install Tk (for the companion GUI app)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tk

      - name: Build Linux .deb
        if: matrix.os == 'ubuntu-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
        run: |
          chmod +x packaging/linux/build_deb.sh packaging/linux/debian/postinst packaging/linux/debian/prerm
          ./packaging/linux/build_deb.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: giddh-dsc-bridge-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

  release:
    name: Attach installers to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
