name: Build DSC Bridge installers

# Produces the macOS .dmg, Windows .exe, and Linux .deb installers for the
# Giddh DSC Bridge (native host + status companion app).

on:
  push:
    branches:
      - main
      - "test-*"
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.6.0). Leave blank to use the VERSION file."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi

      - name: Install Python build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r dsc-bridge/native-host/requirements.txt

      # =====================================================================
      # macOS
      # Import certs -> Build .pkg inside DMG -> Sign DMG -> Notarize -> Verify
      # =====================================================================

      - name: Import Apple Developer ID certificate
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/giddh-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "Decoding Apple certificate..."
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate file is empty."
            exit 1
          fi

          echo "Creating temporary signing keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Importing Developer ID certificate(s)..."
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          echo "Configuring keychain access..."
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Setting temporary keychain as active keychain..."
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "Available identities:"
          security find-identity -v "$KEYCHAIN_PATH"

          echo ""
          echo "Recording Developer ID identities..."

          SIGNING_IDENTITY=$(
            security find-identity -v "$KEYCHAIN_PATH" |
            awk -F'"' '/Developer ID Application/ {print $2; exit}'
          )

          INSTALLER_IDENTITY=$(
            security find-identity -v "$KEYCHAIN_PATH" |
            awk -F'"' '/Developer ID Installer/ {print $2; exit}'
          )

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::Developer ID Application certificate not found."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "Application Identity: $SIGNING_IDENTITY"
          echo "Installer Identity: ${INSTALLER_IDENTITY:-'(None found in .p12)'}"

      - name: Build macOS .dmg
        if: matrix.os == 'macos-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ env.APPLE_INSTALLER_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            packaging/macos/build_macos.sh \
            packaging/macos/scripts/postinstall

          ./packaging/macos/build_macos.sh

      - name: Sign macOS DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail

          DMG=$(find dist -maxdepth 1 -type f -name "GiddhDSCBridge-*.dmg" | head -1)

          if [ -z "$DMG" ]; then
            echo "::error::macOS DMG not found."
            exit 1
          fi

          echo "Signing DMG container with Developer ID Application..."
          codesign \
            --force \
            --verbose \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$DMG"

          echo "Verifying DMG signature..."
          codesign --verify --verbose=2 "$DMG"

      - name: Notarize macOS DMG
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          DMG=$(find dist -maxdepth 1 -type f -name "GiddhDSCBridge-*.dmg" | head -1)

          if [ -z "$DMG" ]; then
            echo "::error::DMG not found for notarization."
            exit 1
          fi

          echo "Submitting DMG to Apple Notary Service..."

          set +e
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1)
          SUBMIT_EXIT_CODE=$?
          set -e

          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | awk '/id:/ {print $2; exit}')

          if [ $SUBMIT_EXIT_CODE -ne 0 ] || ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "::error::Apple notarization failed."
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching Apple notarization rejection log for submission $SUBMISSION_ID..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"

          echo "Validating stapled ticket..."
          xcrun stapler validate "$DMG"

          echo "Verifying mounted content with Gatekeeper..."
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          
          if [ -d "$MOUNT_DIR"/*.app ]; then
            spctl --assess --type execute --verbose=4 "$MOUNT_DIR"/*.app
          elif [ -f "$MOUNT_DIR"/*.pkg ]; then
            spctl --assess --type install --verbose=4 "$MOUNT_DIR"/*.pkg
          fi
          
          hdiutil detach "$MOUNT_DIR" -quiet
          echo "macOS DMG notarization and Gatekeeper verification completed successfully!"

      # =====================================================================
      # Windows
      # =====================================================================

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --no-progress -y

      - name: Freeze Windows executables
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./packaging/windows/freeze.ps1

      - name: Check signing credentials
        if: matrix.os == 'windows-latest'
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.ES_USERNAME }}" ] && [ -n "${{ secrets.ES_PASSWORD }}" ] && \
             [ -n "${{ secrets.ES_CREDENTIAL_ID }}" ] && [ -n "${{ secrets.ES_TOTP_SECRET }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create signing output directories
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/signed-host" | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts/signed-status" | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts/signed-installer" | Out-Null

      - name: Sign host executable (SSL.com eSigner)
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.HOST_EXE_PATH }}
          output_path: artifacts/signed-host
          malware_block: false
          environment_name: PROD
          override: true

      - name: Sign status app executable (SSL.com eSigner)
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.STATUS_EXE_PATH }}
          output_path: artifacts/signed-status
          malware_block: false
          environment_name: PROD
          override: true

      - name: Copy signed executables back and verify
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedHost = Get-ChildItem -Path "artifacts/signed-host" -Filter "*.exe" | Select-Object -First 1
          $signedStatus = Get-ChildItem -Path "artifacts/signed-status" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $signedHost.FullName $env:HOST_EXE_PATH -Force
          Copy-Item $signedStatus.FullName $env:STATUS_EXE_PATH -Force

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1

      - name: Sign installer (SSL.com eSigner)
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ env.INSTALLER_PATH }}
          output_path: artifacts/signed-installer
          malware_block: false
          environment_name: PROD
          override: true

      - name: Copy signed installer back and verify
        if: matrix.os == 'windows-latest' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem -Path "artifacts/signed-installer" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $signedInstaller.FullName $env:INSTALLER_PATH -Force

      # =====================================================================
      # Linux
      # =====================================================================

      - name: Install Tk (for companion GUI)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Build Linux .deb
        if: matrix.os == 'ubuntu-latest'
        env:
          GIDDH_EXT_ID: ${{ vars.GIDDH_EXT_ID }}
        shell: bash
        run: |
          chmod +x packaging/linux/build_deb.sh packaging/linux/debian/postinst packaging/linux/debian/prerm
          ./packaging/linux/build_deb.sh

      # =====================================================================
      # Upload build artifacts
      # =====================================================================

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: giddh-dsc-bridge-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

  upload_to_s3:
    name: Upload to S3
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect environment from branch
        id: env
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == test-* ]]; then
            echo "env=test" >> "$GITHUB_OUTPUT"
          else
            echo "env=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download Windows + macOS + Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Find signed Windows installer
        id: win
        shell: bash
        run: |
          WIN_DIR="artifacts/giddh-dsc-bridge-windows-latest"
          INSTALLER=$(find "$WIN_DIR" -maxdepth 2 -name "GiddhDSCBridge-Setup-*.exe" -not -name "*.blockmap" | head -1)
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$INSTALLER" .exe | sed 's/GiddhDSCBridge-Setup-//')" >> "$GITHUB_OUTPUT"

      - name: Upload Windows installer to S3 (versioned)
        env:
          S3_PATH_PREFIX: ${{ steps.env.outputs.env }}
          S3_VERSION: ${{ steps.win.outputs.version }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        shell: bash
        run: |
          aws s3 cp "${{ steps.win.outputs.installer }}" \
            "s3://$S3_BUCKET/$S3_PATH_PREFIX/windows/$S3_VERSION/$(basename "${{ steps.win.outputs.installer }}")" \
            --content-type "application/x-msdownload"

      - name: Promote Windows installer to "latest" (prod only)
        if: steps.env.outputs.env == 'prod'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        shell: bash
        run: |
          aws s3 cp "${{ steps.win.outputs.installer }}" \
            "s3://$S3_BUCKET/prod/windows/latest/GiddhDSCBridge-Setup.exe" \
            --content-type "application/x-msdownload"

      - name: Find macOS DMG
        id: macos
        shell: bash
        run: |
          MAC_DIR="artifacts/giddh-dsc-bridge-macos-latest"
          DMG=$(find "$MAC_DIR" -maxdepth 2 -name "GiddhDSCBridge-*.dmg" | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$DMG" .dmg | sed 's/GiddhDSCBridge-//')" >> "$GITHUB_OUTPUT"

      - name: Upload macOS DMG to S3 (versioned)
        env:
          S3_PATH_PREFIX: ${{ steps.env.outputs.env }}
          S3_VERSION: ${{ steps.macos.outputs.version }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        shell: bash
        run: |
          aws s3 cp "${{ steps.macos.outputs.dmg }}" \
            "s3://$S3_BUCKET/$S3_PATH_PREFIX/macos/$S3_VERSION/$(basename "${{ steps.macos.outputs.dmg }}")" \
            --content-type "application/x-apple-diskimage"

      - name: Promote macOS DMG to "latest" (prod only)
        if: steps.env.outputs.env == 'prod'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        shell: bash
        run: |
          aws s3 cp "${{ steps.macos.outputs.dmg }}" \
            "s3://$S3_BUCKET/prod/macos/latest/GiddhDSCBridge.dmg" \
            --content-type "application/x-apple-diskimage"

      - name: Find Linux .deb
        id: linux
        shell: bash
        run: |
          LINUX_DIR="artifacts/giddh-dsc-bridge-ubuntu-latest"
          DEB=$(find "$LINUX_DIR" -maxdepth 2 -name "giddh-dsc-bridge_*.deb" | head -1)
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$DEB" | sed -n 's/.*giddh-dsc-bridge_\([^_]*\)_.*\.deb/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Upload Linux .deb to S3 (versioned)
        env:
          S3_PATH_PREFIX: ${{ steps.env.outputs.env }}
          S3_VERSION: ${{ steps.linux.outputs.version }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        shell: bash
        run: |
          aws s3 cp "${{ steps.linux.outputs.deb }}" \
            "s3://$S3_BUCKET/$S3_PATH_PREFIX/linux/$S3_VERSION/$(basename "${{ steps.linux.outputs.deb }}")" \
            --content-type "application/vnd.debian.binary-package"

      - name: Promote Linux .deb to "latest" (prod only)
        if: steps.env.outputs.env == 'prod'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        shell: bash
        run: |
          aws s3 cp "${{ steps.linux.outputs.deb }}" \
            "s3://$S3_BUCKET/prod/linux/latest/giddh-dsc-bridge.deb" \
            --content-type "application/vnd.debian.binary-package"

  release:
    name: Attach installers to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*